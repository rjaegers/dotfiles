- defaults:
    link:
      create: true
      relink: true
- link:
    ~/.config/rjaegers-dotfiles/bash-aliases: configs/bash/bash-aliases
    ~/.config/starship.toml: configs/starship/starship.toml
    ~/.config/eza/theme.yml: eza-themes/themes/gruvbox-dark.yml
- shell:
    - [python3 scripts/install-tools.py, Installing Linux tools]
    - [bash scripts/setup-bash.sh, Configuring Bash]
    - [bash scripts/install-herdr.sh, Installing Herdr and Herdr Projects]
