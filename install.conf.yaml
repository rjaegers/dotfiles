- defaults:
    link:
      create: true
      relink: true
- link:
    ~/.config/rjaegers-dotfiles/bash-aliases: configs/bash/bash-aliases
    ~/.config/starship.toml: configs/starship/starship.toml
    ~/.config/eza/theme.yml: eza-themes/themes/gruvbox-dark.yml
- shell:
    - command: python3 scripts/install-tools.py
      description: Installing Linux tools and Herdr
      stdout: true
      stderr: true
    - command: bash scripts/setup-bash.sh
      description: Configuring Bash
      stdout: true
      stderr: true
    - command: bash scripts/install-herdr.sh
      description: Installing and configuring Herdr Projects
      stdin: true
      stdout: true
      stderr: true
